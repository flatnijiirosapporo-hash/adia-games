<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10分チェック</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Yu Gothic','Hiragino Sans',sans-serif;background:linear-gradient(135deg,#f8fbff,#fff7ed);color:#203044;font-size:18px;line-height:1.7;user-select:none}
a{text-decoration:none;color:inherit}
.wrap{width:min(980px,92vw);margin:0 auto}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e2e8f0}
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:900}
.pill{background:#eef2ff;color:#3730a3;border-radius:999px;padding:8px 14px}
.hero{padding:30px 0 16px}
.brand{display:inline-block;background:#fff;border-radius:999px;padding:8px 16px;box-shadow:0 8px 25px rgba(30,41,59,.08);font-weight:900}
h1{font-size:clamp(32px,6vw,54px);line-height:1.15;margin:16px 0 8px}
.lead{color:#64748b;font-size:clamp(17px,3vw,22px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:20px 0 34px}
.card{background:rgba(255,255,255,.95);border-radius:30px;padding:22px;box-shadow:0 15px 45px rgba(30,41,59,.10);border:1px solid rgba(255,255,255,.85)}
.menu{min-height:150px}.icon{font-size:52px}.title{font-size:24px;font-weight:900;margin-bottom:8px}.desc{font-size:16px;color:#64748b}
.panel{background:rgba(255,255,255,.96);border-radius:34px;padding:22px;box-shadow:0 18px 55px rgba(30,41,59,.12);margin:22px 0 38px}
.status{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-weight:800;margin-bottom:12px}
.badge{padding:8px 14px;border-radius:999px;background:#f1f5f9}
.illust{font-size:clamp(70px,16vw,126px);text-align:center;margin:8px 0;white-space:pre-line}
.scene{font-size:clamp(24px,5vw,34px);font-weight:900;text-align:center;line-height:1.55;white-space:pre-line;margin:10px 0 18px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
button{border:0;border-radius:999px;padding:13px 22px;font-size:20px;font-weight:900;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:white;box-shadow:0 10px 25px rgba(79,70,229,.22);cursor:pointer}
button.light{background:#fff;color:#334155;border:2px solid #e2e8f0;box-shadow:none}
button.gray{background:#64748b}
.choices{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.choice,.tile{background:white;border:4px solid #dbeafe;border-radius:24px;padding:18px;font-size:clamp(20px,4vw,26px);font-weight:900;text-align:center;white-space:pre-line;box-shadow:0 8px 20px rgba(30,41,59,.08);cursor:pointer}
.tile{min-height:96px;display:flex;align-items:center;justify-content:center;font-size:44px}
.correct{border-color:#86efac!important;background:#f0fdf4!important}.wrong{border-color:#fca5a5!important;background:#fef2f2!important}
.message{text-align:center;font-size:28px;font-weight:900;min-height:42px;margin:14px 0}.ok{color:#16a34a}.ng{color:#dc2626}
.tip,.report{margin-top:14px;border-radius:26px;padding:18px;background:#f8fafc;border:2px solid #e2e8f0}.tip{background:#ecfdf5;border-color:#bbf7d0}.report{background:#fff7ed;border-color:#fed7aa}
.reportItem{background:#fff;border:3px solid #fed7aa;border-radius:22px;padding:16px;margin:14px 0}
.hidden{display:none!important}
.footer{text-align:center;color:#64748b;padding:22px}
.shape{width:90px;height:90px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:42px;border:5px solid #fff;box-shadow:0 8px 20px rgba(30,41,59,.12)}
.red{background:#ef4444}.blue{background:#3b82f6}.yellow{background:#facc15}.green{background:#22c55e}.purple{background:#a855f7}.orange{background:#fb923c}
@media(min-width:720px){.choices{grid-template-columns:1fr 1fr}.panel{padding:30px}}

.scoreLiveHide{display:none!important}

.versionBadge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,#4f46e5,#06b6d4);
  color:white;
  font-weight:1000;
  border-radius:999px;
  padding:10px 18px;
  box-shadow:0 10px 24px rgba(79,70,229,.22);
  margin:12px 0;
}
.versionNote{
  display:inline-block;
  background:#fff;
  color:#475569;
  border:2px solid #e2e8f0;
  border-radius:999px;
  padding:8px 14px;
  font-weight:800;
  margin-left:8px;
}
@media(max-width:640px){
  .versionNote{margin-left:0;margin-top:8px}
}

.liveResultHide{display:none!important}

const LIMIT=12;
let deck=[], idx=0, score=0, records=[], current='', timeLeft=LIMIT, timer=null, answered=false;
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function R(text){const raw=String(text??'');let out='',i=0;while(i<raw.length){let hit=null;for(const pair of FURI){const w=pair[0]; if(!w) continue; if(raw.slice(i,i+w.length)===w){hit=pair;break}}if(hit){out+=`<ruby class="autoRuby"><rb>${esc(hit[0])}</rb><rt>${esc(hit[1])}</rt></ruby>`;i+=hit[0].length}else{out+=esc(raw[i]);i++}}return out}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){clearInterval(timer);deck=nijiDrawBalanced(DATA,"cognitive",10);idx=0;score=0;records=[];document.getElementById('score').textContent=score;document.getElementById('total').textContent=deck.length;document.getElementById('report').classList.add('hidden');document.getElementById('report').innerHTML='';showQuestion()}
function showQuestion(){clearInterval(timer);answered=false;document.getElementById('msg').textContent='';document.getElementById('scene').classList.remove('hideQuestion');if(idx>=deck.length){finish();return}const q=deck[idx];current=q.scene;document.getElementById('num').textContent=idx+1;document.getElementById('scene').innerHTML=R(q.scene);const box=document.getElementById('choices');box.innerHTML='';shuffle(q.choices).forEach(c=>{const b=document.createElement('button');b.type='button';b.className='tenChoice';b.innerHTML=R(c.text);b.onclick=()=>answer(c,q,b);box.appendChild(b)});startTimer()}
function startTimer(){clearInterval(timer);timeLeft=LIMIT;updateTimer();timer=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft===Math.floor(LIMIT/2))document.getElementById('scene').classList.add('hideQuestion');if(timeLeft<=0)timeUp()},1000)}
function updateTimer(){document.getElementById('time').textContent=Math.max(0,timeLeft);document.getElementById('timerFill').style.width=Math.max(0,(timeLeft/LIMIT)*100)+'%'}
function answer(c,q,btn){if(answered)return;answered=true;clearInterval(timer);document.getElementById('scene').classList.remove('hideQuestion');document.querySelectorAll('.tenChoice').forEach(x=>x.disabled=true);const correct=q.choices.find(x=>x.ok);const ok=!!c.ok;if(ok){score++;document.getElementById('score').textContent=score;btn.classList.add('correct');document.getElementById('msg').innerHTML='<span class="ok">いいね！</span>'}else{btn.classList.add('wrong');document.getElementById('msg').innerHTML='<span class="ng">かくにんしよう</span>'}records.push({scene:q.scene,selected:c.text,correct:correct?correct.text:'',ok,tip:q.tip||''});setTimeout(()=>{idx++;showQuestion()},550)}
function timeUp(){if(answered)return;answered=true;clearInterval(timer);document.getElementById('scene').classList.remove('hideQuestion');document.querySelectorAll('.tenChoice').forEach(x=>x.disabled=true);const q=deck[idx];const correct=q.choices.find(x=>x.ok);document.getElementById('msg').innerHTML='<span class="ng">じかんです</span>';records.push({scene:q.scene,selected:'じかんぎれ',correct:correct?correct.text:'',ok:false,tip:q.tip||''});setTimeout(()=>{idx++;showQuestion()},550)}
function finish(){clearInterval(timer);document.getElementById('scene').classList.remove('hideQuestion');document.getElementById('scene').innerHTML=R('おしまい');document.getElementById('choices').innerHTML='';document.getElementById('msg').innerHTML='<span class="ok">レポートを ひょうじしました</span>';let h='<h2>'+R('10分チェック レポート')+'</h2>';h+='<div class="tenReportItem"><b>'+R('取り組んだ問題')+'：</b>'+records.length+'もん<br><b>'+R('正解')+'：</b>'+score+'もん<br><b>'+R('確認')+'：</b>'+(records.length-score)+'もん</div>';if(records.length===0)h+='<p>まだ とりくみ きろくが ありません。</p>';records.forEach((r,n)=>{h+='<div class="tenReportItem"><b>'+(n+1)+'. '+R(r.scene)+'</b><p><b>'+R('選んだ答え')+'：</b>'+R(r.selected)+' '+(r.ok?'○':'△')+'</p><p><b>'+R('よい答え')+'：</b>'+R(r.correct)+'</p><p><b>'+R('ポイント')+'：</b>'+R(r.tip)+'</p></div>'});h+='<div class="actions"><button onclick="document.getElementById(&quot;nijiflaUniversalReport&quot;)?.click()">結果・評価をA4印刷</button></div>';const report=document.getElementById('report');report.innerHTML=h;report.classList.remove('hidden')}
function readQ(){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(current||document.getElementById('scene').textContent);u.lang='ja-JP';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('scene').innerHTML=R('スタートしてね');document.getElementById('total').textContent=DATA.length;document.getElementById('time').textContent=LIMIT});
</script>



<script>
(function(){
  function getStartFunction(){
    if (typeof window.start === "function") return window.start;
    if (typeof window.startGame === "function") return window.startGame;
    if (typeof window.newGame === "function") return window.newGame;
    if (typeof window.begin === "function") return window.begin;
    return null;
  }

  window.hideStartButton = function(){
    var b = document.getElementById("startBtn");
    if (b) b.classList.add("hiddenStart");
  };

  window.showStartButton = function(){
    var b = document.getElementById("startBtn");
    if (b) b.classList.remove("hiddenStart");
  };

  window.confirmRetryGame = function(){
    var old = document.getElementById("retryConfirmOverlay");
    if (old) old.remove();

    var overlay = document.createElement("div");
    overlay.className = "confirmOverlay";
    overlay.id = "retryConfirmOverlay";
    overlay.innerHTML =
      '<div class="confirmCard">' +
        '<h2>もう1回の前に</h2>' +
        '<p>周りにやりたい友達がいないか確認してね。</p>' +
        '<div class="confirmActions">' +
          '<button type="button" id="retryOkBtn">OK</button>' +
          '<button type="button" class="light" id="retryCancelBtn">やめる</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    document.getElementById("retryCancelBtn").onclick = function(){
      overlay.remove();
    };

    document.getElementById("retryOkBtn").onclick = function(){
      overlay.remove();
      var box = document.getElementById("retryBox");
      if (box) box.remove();

      var fn = getStartFunction();
      if (fn) {
        try {
          fn();
          setTimeout(window.hideStartButton, 0);
        } catch(e) {
          location.reload();
        }
      } else {
        location.reload();
      }
    };
  };

  window.showRetryButton = function(){
    if (document.getElementById("retryBox")) return;

    var target =
      document.getElementById("msg") ||
      document.getElementById("report") ||
      document.querySelector(".panel") ||
      document.body;

    var box = document.createElement("div");
    box.className = "retryBox";
    box.id = "retryBox";
    box.innerHTML = '<button type="button" class="retryBtn" onclick="confirmRetryGame()">もう1回</button>';

    if (target && target.parentNode) {
      target.parentNode.insertBefore(box, target.nextSibling);
    } else {
      document.body.appendChild(box);
    }
  };

  document.addEventListener("DOMContentLoaded", function(){
    var b = document.getElementById("startBtn");
    if (b) {
      b.textContent = "スタート";
      b.addEventListener("click", function(){
        setTimeout(window.hideStartButton, 0);
      });
    }
  });
})();
</script>
