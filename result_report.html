<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>結果・評価シート｜にじフラ</title><link rel="icon" href="nijifla_icon.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#183047;font-family:system-ui,'Yu Gothic','Hiragino Sans',sans-serif;line-height:1.45}.screenbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dbe5ea;padding:10px 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.screenbar button,.screenbar a{border:0;border-radius:999px;padding:10px 16px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#0f766e;color:#fff}.light{background:#edf3f5;color:#234}.saved{font-size:12px;font-weight:900;color:#0f766e;align-self:center;min-width:70px;text-align:center}.sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:10mm 11mm 9mm;box-shadow:0 10px 35px #4562}.head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border-bottom:3px solid #0f766e;padding-bottom:5mm}.brand{font-size:12px;font-weight:900;color:#0f766e}.head h1{font-size:22px;margin:2px 0}.stamp{border:2px solid #8aa4b2;border-radius:8px;width:28mm;height:18mm;display:grid;place-items:center;color:#789;font-size:11px}.meta{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;margin:4mm 0}.field{border:1px solid #b7c7cf;border-radius:6px;padding:5px 7px;min-height:14mm}.field label,.label{display:block;font-size:9px;font-weight:900;color:#5a7180;margin-bottom:2px}.field input,.field textarea,.field select{width:100%;border:0;outline:0;font:inherit;background:transparent}.field input{font-size:13px;font-weight:800}.summary{display:grid;grid-template-columns:1.25fr .75fr;gap:6px}.box{border:1px solid #b7c7cf;border-radius:7px;padding:6px 8px;min-height:20mm}.box h2{font-size:11px;margin:0 0 4px;color:#0f766e}.resultTitle{font-size:16px;font-weight:1000}.score{font-size:22px;font-weight:1000;color:#0f766e}.detail{font-size:11px;white-space:pre-wrap}.ratings{margin-top:4mm;border-collapse:collapse;width:100%;font-size:10px}.ratings th,.ratings td{border:1px solid #b7c7cf;padding:4px;text-align:center}.ratings th:first-child{text-align:left;width:34%}.ratings select{border:0;background:transparent;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4mm}.write{border:1px solid #b7c7cf;border-radius:7px;padding:6px 8px;min-height:34mm}.write textarea{width:100%;height:24mm;border:0;resize:none;outline:0;font:inherit;font-size:11px}.sstOnly{display:none}.sst .sstOnly{display:table-row}.foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4mm}.smallnote{font-size:8.5px;color:#5a7180;margin-top:3mm}.recordMeta{display:flex;justify-content:space-between;gap:8px;font-size:7.5px;color:#718592;margin-top:2mm;border-top:1px solid #dbe5ea;padding-top:1.5mm}.sig{border:1px solid #b7c7cf;border-radius:7px;padding:6px 8px;min-height:18mm}.sig input{border:0;border-bottom:1px solid #9fb2bc;width:75%;font:inherit}.systemEval{font-size:10px;color:#435b68}.noRec{padding:30px;text-align:center}.sheet.compact1{padding-top:7mm;padding-bottom:6mm}.sheet.compact1 .head{padding-bottom:3mm}.sheet.compact1 .meta,.sheet.compact1 .ratings,.sheet.compact1 .two,.sheet.compact1 .foot{margin-top:2mm}.sheet.compact1 .ratings th,.sheet.compact1 .ratings td{padding:3px}.sheet.compact1 .write{min-height:28mm}.sheet.compact1 .write textarea{height:19mm}.sheet.compact2{font-size:12px;padding-top:6mm;padding-bottom:5mm}.sheet.compact2 .head h1{font-size:19px}.sheet.compact2 .meta{margin:2mm 0}.sheet.compact2 .field{min-height:11mm;padding:4px 6px}.sheet.compact2 .box{min-height:17mm;padding:5px 7px}.sheet.compact2 .ratings{font-size:9px;margin-top:2mm}.sheet.compact2 .ratings th,.sheet.compact2 .ratings td{padding:2px 3px}.sheet.compact2 .two,.sheet.compact2 .foot{margin-top:2mm}.sheet.compact2 .write{min-height:24mm;padding:5px 7px}.sheet.compact2 .write textarea{height:16mm;font-size:10px}.sheet.compact2 .sig{min-height:14mm}.sheet.compact2 .smallnote{font-size:7.5px;margin-top:2mm}
@page{size:A4 portrait;margin:0}@media print{body{background:#fff}.screenbar{display:none!important}.sheet{margin:0;box-shadow:none;width:210mm;height:296mm;min-height:296mm;max-height:296mm;overflow:hidden;padding:9mm 10mm 8mm}.field,.box,.write,.sig{break-inside:avoid}.smallnote{font-size:8px}}
@media(max-width:800px){.sheet{width:100%;min-height:0;margin:0;padding:18px;box-shadow:none}.meta,.summary,.two,.foot{grid-template-columns:1fr}.stamp{display:none}}
</style><link rel="stylesheet" href="assets/ui_v24.css"><style>@media print{
html,body{width:210mm!important;height:297mm!important;max-height:297mm!important;overflow:hidden!important;margin:0!important;padding:0!important}
.sheet.sst{padding:6mm 8mm 5mm!important;font-size:11px!important}
.sheet.sst .head{padding-bottom:2mm!important}.sheet.sst .head h1{font-size:18px!important}
.sheet.sst .meta{margin:2mm 0!important;gap:4px!important}.sheet.sst .field{min-height:10mm!important;padding:3px 5px!important}
.sheet.sst .summary{gap:4px!important}.sheet.sst .box{min-height:15mm!important;padding:4px 6px!important}.sheet.sst .score{font-size:18px!important}
.sheet.sst .ratings{font-size:8.3px!important;margin-top:2mm!important}.sheet.sst .ratings th,.sheet.sst .ratings td{padding:1.5px 3px!important}
.sheet.sst .two,.sheet.sst .foot{gap:4px!important;margin-top:2mm!important}.sheet.sst .write{min-height:20mm!important;padding:4px 6px!important}.sheet.sst .write textarea{height:12mm!important;font-size:9px!important}
.sheet.sst .sig{min-height:11mm!important;padding:4px 6px!important}.sheet.sst .smallnote{font-size:7px!important;margin-top:1.5mm!important}.sheet.sst .recordMeta{margin-top:1mm!important;padding-top:1mm!important}
}</style></head><body>
<div class="screenbar"><a class="light" href="index.html">← TOP</a><a class="light" href="records.html">記録一覧</a><button class="light" type="button" onclick="history.back()">戻る</button><button class="primary" id="printBtn" type="button">A4 1枚で印刷</button><button class="light" id="saveBtn" type="button">評価を保存</button><span class="saved" id="saveState"></span></div>
<main class="sheet" id="sheet"><div class="noRec">記録を読み込んでいます…</div></main>
<script src="assets/result_store.js"></script><script src="assets/accessibility.js"></script>
<script>
const sheet=document.getElementById('sheet');const qs=new URLSearchParams(location.search);let rid=qs.get('id')||NIJI_RESULT.getLastId(),rec=NIJI_RESULT.get(rid);try{const raw=qs.get('r');if(raw){const bridge=JSON.parse(raw);if(!rec&&bridge.record){rec=NIJI_RESULT.save(bridge.record);rid=rec.id}if(rec&&bridge.evaluation&&Object.keys(bridge.evaluation).length){const cur=NIJI_RESULT.getEvaluation(rec.id)||{};if(!Object.keys(cur).some(k=>cur[k]&&k!=='updatedAt'))NIJI_RESULT.saveEvaluation(rec.id,bridge.evaluation)}}}catch(e){console.warn('bridge record could not be loaded',e)}const saveState=document.getElementById('saveState');
const E=(s)=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fmtDate(iso){const d=iso?new Date(iso):new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function axisRow(name,key,cls=''){return `<tr class="${cls}"><th>${name}</th><td><select data-k="${key}"><option value="">—</option><option>◎</option><option>○</option><option>△</option></select></td><td class="axisHelp">◎安定　○概ね　△支援あり　—未評価</td></tr>`}
function suggest(r){if(r.success===true)return 'ゲーム上の達成条件を満たしました。支援場面での般化・再現性は職員評価で確認してください。';if(r.success===false)return 'ゲーム上の達成条件には届きませんでした。誤答・失敗そのものではなく、取り組み方や必要な支援量を記録してください。';return '客観的なゲーム結果を記載しています。下欄の評価は実際の観察に基づき職員が入力してください。'}
function render(){if(!rec){sheet.innerHTML='<div class="noRec">印刷できる結果記録がありません。ゲーム終了後に「結果・評価を印刷」を押してください。<br><br><a href="records.html">記録一覧を見る</a></div>';return}const isSST=/SST|気持ち|順番|トラブル|言葉|会話|社会/.test(`${rec.category} ${rec.title} ${rec.type}`);sheet.classList.toggle('sst',isSST);sheet.innerHTML=`
<div class="head"><div><div class="brand">にじいろクラス フラット札幌｜活動結果・評価記録</div><h1>ゲーム・SST 実施記録</h1><div style="font-size:10px">客観結果＋支援者観察をA4 1枚に集約</div></div><div class="stamp">確認印</div></div>
<div class="meta"><div class="field"><label>児童名</label><input data-k="child" list="childOptions" placeholder="氏名を入力" autocomplete="off"><datalist id="childOptions"></datalist></div><div class="field"><label>実施日時</label><input value="${E(fmtDate(rec.createdAt))}" readonly></div><div class="field"><label>担当職員</label><input data-k="staff" list="staffOptions" placeholder="担当者名" autocomplete="off"><datalist id="staffOptions"></datalist></div></div>
<div class="summary"><div class="box"><h2>実施内容</h2><div class="resultTitle">${E(rec.title)}</div><div style="font-size:10px">${E(rec.category||'')} ${rec.durationSec!=null?'｜所要 '+E(rec.durationSec)+'秒':''}</div><div class="detail">${E(rec.detail||'')}</div></div><div class="box"><h2>客観結果</h2><div class="score">${E(rec.score||'実施完了')}</div><div class="systemEval">${E(suggest(rec))}</div></div></div>
<table class="ratings"><thead><tr><th>観察評価</th><th style="width:13%">評価</th><th>基準</th></tr></thead><tbody>
${axisRow('参加・取り組み姿勢','engage')}${axisRow('指示・ルール理解','understand')}${axisRow('注意・集中の持続','attention')}${axisRow('判断・切り替え','switch')}${axisRow('自己調整・落ち着き','regulation')}${axisRow('場面・状況の理解','sst_scene','sstOnly')}${axisRow('相手の気持ち・視点','sst_perspective','sstOnly')}${axisRow('ことば・行動の選択','sst_action','sstOnly')}</tbody></table>
<div class="two"><div class="write"><div class="label">観察メモ｜できたこと・支援が必要だった場面</div><textarea data-k="note" maxlength="280" placeholder="例：声かけ1回で再開できた／選択肢を2つにすると自分で選べた"></textarea></div><div class="write"><div class="label">次回のねらい・支援方法</div><textarea data-k="next" maxlength="240" placeholder="例：同じ場面をロールプレイし、自分の言葉で伝える練習へ"></textarea></div></div>
<div class="foot"><div class="sig"><div class="label">本人のふりかえり</div><input data-k="childVoice" maxlength="80" placeholder="たのしかった／むずかしかった など"></div><div class="sig"><div class="label">総合評価</div><select data-k="overall"><option value="">未評価</option><option>◎ 自立して取り組めた</option><option>○ 一部支援で取り組めた</option><option>△ 継続した支援が必要</option></select></div></div>
<div class="smallnote">※ゲームの正答率や成功・失敗だけで療育上の能力を判定しません。評価欄は、実際の支援場面で観察した行動・必要な支援量・本人の様子を根拠に記録してください。</div><div class="recordMeta"><span>記録ID：${E(rec.id)}</span><span>保存元：${E(rec.source||'')}</span></div>`;loadForm();bindAutosave();}
function controls(){return [...document.querySelectorAll('[data-k]')]}
function loadForm(){if(!rec)return;const x=NIJI_RESULT.getEvaluation(rec.id)||{},rc=rec.extra?.sessionContext||{},c=NIJI_RESULT.sessionContext?.()||{};controls().forEach(el=>{if(x[el.dataset.k]!=null&&x[el.dataset.k]!=='' )el.value=x[el.dataset.k];else if(el.dataset.k==='child'&&(rc.child||c.child))el.value=rc.child||c.child;else if(el.dataset.k==='staff'&&(rc.staff||c.staff))el.value=rc.staff||c.staff});populateKnown()} 
function populateKnown(){const cs=new Set(),ss=new Set();try{for(const r of NIJI_RESULT.list()){const e=NIJI_RESULT.getEvaluation(r.id)||{};if(e.child)cs.add(e.child);if(e.staff)ss.add(e.staff)}}catch{};const escAttr=v=>E(v);const cl=document.getElementById('childOptions'),sl=document.getElementById('staffOptions');if(cl)cl.innerHTML=[...cs].sort().map(v=>`<option value="${escAttr(v)}"></option>`).join('');if(sl)sl.innerHTML=[...ss].sort().map(v=>`<option value="${escAttr(v)}"></option>`).join('')}
let timer=null;function snapshot(){const x={};controls().forEach(el=>x[el.dataset.k]=el.value);return x}
function saveForm(silent=false){if(!rec)return;const snap=snapshot();NIJI_RESULT.saveEvaluation(rec.id,snap);NIJI_RESULT.saveSessionContext?.({child:snap.child||'',staff:snap.staff||''});saveState.textContent='保存済み';if(!silent)setTimeout(()=>saveState.textContent='',1800)}
function bindAutosave(){controls().forEach(el=>el.addEventListener('input',()=>{saveState.textContent='入力中…';clearTimeout(timer);timer=setTimeout(()=>saveForm(true),700)}))}
function fitForPrint(){sheet.classList.remove('compact1','compact2');if(!rec)return;const limit=1120;if(sheet.scrollHeight>limit)sheet.classList.add('compact1');requestAnimationFrame(()=>{if(sheet.scrollHeight>limit){sheet.classList.remove('compact1');sheet.classList.add('compact2')}})}
render();setTimeout(fitForPrint,0);document.getElementById('saveBtn').onclick=()=>saveForm();document.getElementById('printBtn').onclick=()=>{saveForm(true);fitForPrint();setTimeout(()=>window.print(),60)};window.addEventListener('beforeprint',()=>{saveForm(true);fitForPrint()});
</script><script src="assets/layout_v25.js"></script></body></html>
