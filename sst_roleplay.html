const NIJI_QUESTION_BANK_VERSION='2026-09-02-q500-v1';
function nijiShuffleIds(values){const a=values.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function createQuestionBag(opts){const ids=[...new Set(opts.ids.map(String))],key='nijifla_qbag_v1:'+opts.gameId+':'+(opts.difficulty||'all');let state=null;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch(e){};const valid=state&&state.bankVersion===opts.bankVersion&&Array.isArray(state.order)&&state.order.length===ids.length&&state.order.every(x=>ids.includes(String(x)))&&Number.isInteger(state.cursor);if(!valid)state={bankVersion:opts.bankVersion,order:nijiShuffleIds(ids),cursor:0};function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function draw(n){const out=[],used=new Set();while(out.length<n){if(state.cursor>=state.order.length)state={bankVersion:opts.bankVersion,order:nijiShuffleIds(ids),cursor:0};const id=String(state.order[state.cursor++]);if(used.has(id))continue;used.add(id);out.push(id);save()}return out}return{draw}}
function nijiDrawBalanced(bank,gameId,count){const ratio=count===10?{easy:4,normal:4,challenge:2}:null,byId=new Map(bank.map(q=>[q.id,q]));if(!ratio){const ids=bank.map(q=>q.id),bag=createQuestionBag({gameId,difficulty:'all',bankVersion:NIJI_QUESTION_BANK_VERSION,ids});return bag.draw(count).map(id=>byId.get(id))}let out=[];for(const d of ['easy','normal','challenge']){const ids=bank.filter(q=>q.difficulty===d).map(q=>q.id),bag=createQuestionBag({gameId,difficulty:d,bankVersion:NIJI_QUESTION_BANK_VERSION,ids});out.push(...bag.draw(ratio[d]).map(id=>byId.get(id)))}return nijiShuffleIds(out)}

let deck=[],i=0,independent=0,ratings=[],startTime=0;function sh(a){return nijiShuffleIds(a)}function begin(){deck=nijiDrawBalanced(SCENES,"sstRoleplay",5);i=independent=0;ratings=[];startTime=performance.now();actions.innerHTML='';show()}function show(){if(i>=5)return finish();num.textContent=i+1;ind.textContent=independent;const s=deck[i];stage.innerHTML=`<div class="scene"><b>${s.goal}</b>\n${s.prompt}</div><div class="roleBox"><div class="small">① 職員が相手役として場面を提示　② 本人が自分の言葉で伝える　③ 必要なら下の見本を使う</div><div class="model">${s.model}</div><div class="small" style="text-align:center">実際に声に出してから、職員が支援量を記録してください。</div><div class="ratingGrid" style="margin-top:14px"><button class="primary" data-r="independent">◎ 自分で言えた</button><button class="warn" data-r="prompt">○ 声かけで言えた</button><button class="secondary" data-r="model">△ 見本が必要</button></div></div>`;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r,s))}function rate(r,s){if(r==='independent')independent++;ratings.push({id:s.id,skill:s.goal,scene:s.prompt,model:s.model,rating:r});i++;show()}function finish(){const sec=Math.round((performance.now()-startTime)/1000);const r=NIJI_RESULT.save({title:'SST｜ロールプレイ',category:'SST',score:`自立 ${independent}/5`,detail:`5場面のロールプレイ。自立 ${independent}、声かけ ${ratings.filter(x=>x.rating==='prompt').length}、見本必要 ${ratings.filter(x=>x.rating==='model').length}。`,success:null,durationSec:sec,type:'sst',source:'sst_roleplay.html',extra:{ratings}});stage.innerHTML=`<div class="result"><h2>ロールプレイ終了</h2><p style="font-size:30px;font-weight:1000">自分で言えた ${independent}/5</p><p>「自立」の数だけでなく、どんな声かけなら言えたかをA4記録に残してください。</p></div>`;actions.innerHTML=`<button class="primary" id="print">結果・評価を印刷</button><button class="secondary" id="retry">もう1回</button><a class="btn secondary" href="sst.html">SST一覧</a>`;print.onclick=()=>location.href=NIJI_RESULT.reportUrl(r);retry.onclick=()=>{if(confirm('周りにやりたい友達がいないか確認してね'))begin()}}start.onclick=begin;
