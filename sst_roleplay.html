<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SST ロールプレイ</title><link rel="stylesheet" href="assets/sst_v21.css"><link rel="stylesheet" href="assets/ui_v24.css"></head><body><div class="top"><div class="nav"><a href="sst.html">← SST</a><span class="pill">実践ロールプレイ</span></div></div><main class="wrap"><section class="hero"><h1>🎭 SST ロールプレイ</h1><p class="lead">「分かる」から「実際に言える」へ。職員と1対1で5場面練習します。</p></section><section class="panel"><div class="status"><span class="badge"><span id="num">0</span>/5</span><span class="badge">自立 <span id="ind">0</span></span></div><div id="stage"><div class="scene">職員が相手役になります。準備ができたらスタート。</div></div><div class="actions" id="actions"><button class="primary" id="start">スタート</button></div></section></main><script src="assets/result_store.js"></script><script>
const SCENES=[
['助けを求める','宿題が分からない。先生に助けを求めよう。','「ここが分からないので、教えてください」'],['断る','危ない遊びに誘われた。断ろう。','「危ないから、ぼくはやらないよ」'],['気持ちを伝える','順番を抜かされて嫌だった。伝えよう。','「先に並んでたよ。後ろに並んでほしい」'],['聞き返す','説明が聞き取れなかった。もう一度お願いしよう。','「もう一度お願いします」'],['仲直り','ぶつかって相手の物を落とした。','「ごめんね。大丈夫？拾うね」'],['参加する','友だちが遊んでいる。入りたい。','「一緒にやってもいい？」'],['休憩を頼む','音が大きくてつらい。','「少し静かなところで休んでもいいですか？」'],['待ってほしい','今使っている物を貸してと言われた。','「今使ってるから、終わったらね」'],['意見を伝える','みんなと違う考えがある。','「ぼくはこう思うよ」'],['確認する','集合時間が分からない。','「集合は何時ですか？」'],['やめてと伝える','からかわれて嫌だった。','「その言い方は嫌だから、やめて」'],['謝る','言い方が強くなってしまった。','「言い方が強かった。ごめん」'],['相手を気遣う','友だちが転んだ。','「大丈夫？先生呼ぶ？」'],['お願いする','自分だけでは重い荷物が持てない。','「一緒に持ってもらえますか？」'],['距離を取る','今は一人で落ち着きたい。','「今は一人で休むね」']];
let deck=[],i=0,independent=0,ratings=[],startTime=0;function sh(a){return [...a].sort(()=>Math.random()-.5)}function begin(){deck=sh(SCENES).slice(0,5);i=independent=0;ratings=[];startTime=performance.now();actions.innerHTML='';show()}function show(){if(i>=5)return finish();num.textContent=i+1;ind.textContent=independent;const s=deck[i];stage.innerHTML=`<div class="scene"><b>${s[0]}</b>\n${s[1]}</div><div class="roleBox"><div class="small">① 職員が相手役として場面を提示　② 本人が自分の言葉で伝える　③ 必要なら下の見本を使う</div><div class="model">${s[2]}</div><div class="small" style="text-align:center">実際に声に出してから、職員が支援量を記録してください。</div><div class="ratingGrid" style="margin-top:14px"><button class="primary" data-r="independent">◎ 自分で言えた</button><button class="warn" data-r="prompt">○ 声かけで言えた</button><button class="secondary" data-r="model">△ 見本が必要</button></div></div>`;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(b.dataset.r,s))}function rate(r,s){if(r==='independent')independent++;ratings.push({skill:s[0],scene:s[1],model:s[2],rating:r});i++;show()}function finish(){const sec=Math.round((performance.now()-startTime)/1000);const r=NIJI_RESULT.save({title:'SST｜ロールプレイ',category:'SST',score:`自立 ${independent}/5`,detail:`5場面のロールプレイ。自立 ${independent}、声かけ ${ratings.filter(x=>x.rating==='prompt').length}、見本必要 ${ratings.filter(x=>x.rating==='model').length}。`,success:null,durationSec:sec,type:'sst',source:'sst_roleplay.html',extra:{ratings}});stage.innerHTML=`<div class="result"><h2>ロールプレイ終了</h2><p style="font-size:30px;font-weight:1000">自分で言えた ${independent}/5</p><p>「自立」の数だけでなく、どんな声かけなら言えたかをA4記録に残してください。</p></div>`;actions.innerHTML=`<button class="primary" id="print">結果・評価を印刷</button><button class="secondary" id="retry">もう1回</button><a class="btn secondary" href="sst.html">SST一覧</a>`;print.onclick=()=>location.href=NIJI_RESULT.reportUrl(r);retry.onclick=()=>{if(confirm('周りにやりたい友達がいないか確認してね'))begin()}}start.onclick=begin;
</script><script src="assets/accessibility.js"></script><script src="assets/layout_v25.js"></script></body></html>
