<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SST 場面づくり</title><link rel="stylesheet" href="assets/sst_v21.css"><link rel="stylesheet" href="assets/ui_v24.css"></head><body><div class="top"><div class="nav"><a href="sst.html">← SST</a><span class="pill">支援者モード</span></div></div><main class="wrap"><section class="hero"><h1>🛠️ SST 場面づくり</h1><p class="lead">その日に実際に起きたことを、その場でSST教材にできます。</p></section><section class="panel" id="editor"><div class="formgrid"><div class="field"><label>場面・できごと</label><textarea id="sceneIn" placeholder="例：公園で鬼ごっこ中、鬼になったら遊びから離れた"></textarea></div><div class="field"><label>今回のねらい</label><textarea id="goalIn" placeholder="例：嫌な気持ちを言葉で伝え、続ける・休むを選ぶ"></textarea></div><div class="field"><label>本人に考えてほしい問い</label><input id="questionIn" value="こんなとき、どうしたらいい？"></div><div class="field"><label>職員が示す見本の言葉・行動</label><textarea id="modelIn" placeholder="例：「鬼になるのは嫌だった。少し休んでから戻る」"></textarea></div></div><div class="actions"><button class="primary" id="practice">この場面で練習する</button></div></section><section class="panel" id="practicePanel" style="display:none"><div class="scene" id="sceneOut"></div><div class="roleBox"><div class="small" id="goalOut"></div><h2 id="qOut" style="text-align:center"></h2><div class="model" id="modelOut"></div><div class="small" style="text-align:center">まず本人の言葉を待ち、必要なときだけ見本を使います。</div><div class="ratingGrid" style="margin-top:14px"><button class="primary" data-rate="◎ 自分で考えられた">◎ 自分で</button><button class="warn" data-rate="○ 声かけで考えられた">○ 声かけ</button><button class="secondary" data-rate="△ 見本が必要だった">△ 見本あり</button></div></div></section></main><script src="assets/result_store.js"></script><script>
practice.onclick=()=>{if(!sceneIn.value.trim()||!goalIn.value.trim())return alert('場面とねらいを入力してください');editor.style.display='none';practicePanel.style.display='block';sceneOut.textContent=sceneIn.value;goalOut.textContent='ねらい：'+goalIn.value;qOut.textContent=questionIn.value;modelOut.textContent=modelIn.value||'本人の言葉を待ってみよう';document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>finishCustom(b.dataset.rate))};function finishCustom(rate){const r=NIJI_RESULT.save({title:'SST｜個別場面トレーニング',category:'SST',score:rate,detail:`場面：${sceneIn.value}｜ねらい：${goalIn.value}｜見本：${modelIn.value}`,success:null,type:'sst',source:'sst_custom.html',extra:{scene:sceneIn.value,goal:goalIn.value,question:questionIn.value,model:modelIn.value,rating:rate}});location.href=NIJI_RESULT.reportUrl(r)}
</script><script src="assets/accessibility.js"></script><script src="assets/layout_v25.js"></script></body></html>
