function createQuestionBag(opts){const ids=[...new Set(opts.ids.map(String))],key='nijifla_qbag_v1:'+opts.gameId+':'+(opts.difficulty||'all');let state=null;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch(e){};const valid=state&&state.bankVersion===opts.bankVersion&&Array.isArray(state.order)&&state.order.length===ids.length&&state.order.every(x=>ids.includes(String(x)))&&Number.isInteger(state.cursor);if(!valid)state={bankVersion:opts.bankVersion,order:nijiShuffleIds(ids),cursor:0};function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function draw(n){const out=[],used=new Set();while(out.length<n){if(state.cursor>=state.order.length)state={bankVersion:opts.bankVersion,order:nijiShuffleIds(ids),cursor:0};const id=String(state.order[state.cursor++]);if(used.has(id))continue;used.add(id);out.push(id);save()}return out}return{draw}}
function nijiDrawBalanced(bank,gameId,count){const ratio=count===10?{easy:4,normal:4,challenge:2}:null,byId=new Map(bank.map(q=>[q.id,q]));if(!ratio){const ids=bank.map(q=>q.id),bag=createQuestionBag({gameId,difficulty:'all',bankVersion:NIJI_QUESTION_BANK_VERSION,ids});return bag.draw(count).map(id=>byId.get(id))}let out=[];for(const d of ['easy','normal','challenge']){const ids=bank.filter(q=>q.difficulty===d).map(q=>q.id),bag=createQuestionBag({gameId,difficulty:d,bankVersion:NIJI_QUESTION_BANK_VERSION,ids});out.push(...bag.draw(ratio[d]).map(id=>byId.get(id)))}return nijiShuffleIds(out)}

let deck=[],i=0,score=0,wrong=[],answered=false,current='';
function start(){deck=nijiDrawBalanced(DATA,"feelingChoice",10);i=0;score=0;wrong=[];answered=false;document.getElementById('score').textContent=score;document.getElementById('report').classList.add('hidden');document.getElementById('report').innerHTML='';show()}
function show(){answered=false;document.getElementById('msg').textContent='';document.getElementById('tip').classList.add('hidden');if(i>=deck.length){finish();return}const q=deck[i];current=q.scene;document.getElementById('num').textContent=i+1;document.getElementById('cat').textContent=q.cat||'';document.getElementById('illust').textContent=q.illust||'🌈';document.getElementById('scene').textContent=q.scene;const box=document.getElementById('choices');box.innerHTML='';shuffle(q.choices).forEach(t=>{const c={text:t,ok:t===q.answer};let d=document.createElement('div');d.className='choice';d.textContent=c.text;d.onclick=()=>answer(c,d);box.appendChild(d)})}
function answer(c,d){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(x=>x.style.pointerEvents='none');const q=deck[i];if(c.ok){score++;document.getElementById('score').textContent=score;d.classList.add('correct');document.getElementById('msg').innerHTML='<span class="ok">いいね！</span>'}else{d.classList.add('wrong');wrong.push({cat:q.cat,illust:q.illust,scene:q.scene,selected:c.text,correct:q.answer,tip:q.tip});document.getElementById('msg').innerHTML='<span class="ng">もう一回考えよう</span>'}document.getElementById('tip').classList.remove('hidden');document.getElementById('tip').innerHTML='<b>ポイント</b><br>'+esc(q.tip||'');setTimeout(()=>{i++;show()},1500)}
function finish(){document.getElementById('num').textContent=10;document.getElementById('illust').textContent='⭐';document.getElementById('scene').textContent='おしまい！\n'+score+' / 10 問できました';document.getElementById('choices').innerHTML='';document.getElementById('tip').classList.add('hidden');const r=document.getElementById('report');r.classList.remove('hidden');let h='<h2>ふりかえりレポート</h2>';if(wrong.length===0){h+='<p>まちがえた問題はありませんでした。</p>'}else{h+='<p>まちがえた問題だけを表示します。</p>';wrong.forEach((w,n)=>{h+='<div class="reportItem"><div style="font-size:52px;text-align:center">'+esc(w.illust||'')+'</div><b>'+(n+1)+'. まちがえた問題</b><div class="scene" style="font-size:22px">'+esc(w.scene).replaceAll("\n","<br>")+'</div><p class="ng"><b>選んだ答え：</b><br>'+esc(w.selected)+'</p><p class="ok"><b>よい答え：</b><br>'+esc(w.correct)+'</p><p><b>ポイント：</b><br>'+esc(w.tip||'')+'</p></div>'})}h+='<div class="actions"><button onclick="document.getElementById(&quot;nijiflaUniversalReport&quot;)?.click()">結果・評価をA4印刷</button></div>';r.innerHTML=h;showRetryButton()}

        '<h2>もう1回の前に</h2>' +
        '<p>周りにやりたい友達がいないか確認してね。</p>' +
        '<div class="confirmActions">' +
          '<button type="button" id="retryOkBtn">OK</button>' +
          '<button type="button" class="light" id="retryCancelBtn">やめる</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    document.getElementById("retryCancelBtn").onclick = function(){
      overlay.remove();
    };

    document.getElementById("retryOkBtn").onclick = function(){
      overlay.remove();
      var box = document.getElementById("retryBox");
      if (box) box.remove();

      var fn = getStartFunction();
      if (fn) {
        try {
          fn();
          setTimeout(window.hideStartButton, 0);
        } catch(e) {
          location.reload();
        }
      } else {
        location.reload();
      }
    };
  };

  window.showRetryButton = function(){
    if (document.getElementById("retryBox")) return;

    var target =
      document.getElementById("msg") ||
      document.getElementById("report") ||
      document.querySelector(".panel") ||
      document.body;

    var box = document.createElement("div");
    box.className = "retryBox";
    box.id = "retryBox";
    box.innerHTML = '<button type="button" class="retryBtn" onclick="confirmRetryGame()">もう1回</button>';

    if (target && target.parentNode) {
      target.parentNode.insertBefore(box, target.nextSibling);
    } else {
      document.body.appendChild(box);
    }
  };

  document.addEventListener("DOMContentLoaded", function(){
    var b = document.getElementById("startBtn");
    if (b) {
      b.textContent = "スタート";
      b.addEventListener("click", function(){
        setTimeout(window.hideStartButton, 0);
      });
    }
  });
})();
</script>
