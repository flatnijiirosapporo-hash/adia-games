<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問題形式SST</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Yu Gothic','Hiragino Sans',sans-serif;background:linear-gradient(135deg,#f8fbff,#fff7ed);color:#203044;font-size:18px;line-height:1.7;user-select:none}
a{text-decoration:none;color:inherit}
.wrap{width:min(980px,92vw);margin:0 auto}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e2e8f0}
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:900}
.pill{background:#eef2ff;color:#3730a3;border-radius:999px;padding:8px 14px}
.hero{padding:30px 0 16px}
.brand{display:inline-block;background:#fff;border-radius:999px;padding:8px 16px;box-shadow:0 8px 25px rgba(30,41,59,.08);font-weight:900}
h1{font-size:clamp(32px,6vw,54px);line-height:1.15;margin:16px 0 8px}
.lead{color:#64748b;font-size:clamp(17px,3vw,22px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:20px 0 34px}
.card{background:rgba(255,255,255,.95);border-radius:30px;padding:22px;box-shadow:0 15px 45px rgba(30,41,59,.10);border:1px solid rgba(255,255,255,.85)}
.menu{min-height:150px}.icon{font-size:52px}.title{font-size:24px;font-weight:900;margin-bottom:8px}.desc{font-size:16px;color:#64748b}
.panel{background:rgba(255,255,255,.96);border-radius:34px;padding:22px;box-shadow:0 18px 55px rgba(30,41,59,.12);margin:22px 0 38px}
.status{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-weight:800;margin-bottom:12px}
.badge{padding:8px 14px;border-radius:999px;background:#f1f5f9}
.illust{font-size:clamp(70px,16vw,126px);text-align:center;margin:8px 0;white-space:pre-line}
.scene{font-size:clamp(24px,5vw,34px);font-weight:900;text-align:center;line-height:1.55;white-space:pre-line;margin:10px 0 18px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
button{border:0;border-radius:999px;padding:13px 22px;font-size:20px;font-weight:900;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:white;box-shadow:0 10px 25px rgba(79,70,229,.22);cursor:pointer}
button.light{background:#fff;color:#334155;border:2px solid #e2e8f0;box-shadow:none}
button.gray{background:#64748b}
.choices{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.choice,.tile{background:white;border:4px solid #dbeafe;border-radius:24px;padding:18px;font-size:clamp(20px,4vw,26px);font-weight:900;text-align:center;white-space:pre-line;box-shadow:0 8px 20px rgba(30,41,59,.08);cursor:pointer}
.tile{min-height:96px;display:flex;align-items:center;justify-content:center;font-size:44px}
.correct{border-color:#86efac!important;background:#f0fdf4!important}.wrong{border-color:#fca5a5!important;background:#fef2f2!important}
.message{text-align:center;font-size:28px;font-weight:900;min-height:42px;margin:14px 0}.ok{color:#16a34a}.ng{color:#dc2626}
.tip,.report{margin-top:14px;border-radius:26px;padding:18px;background:#f8fafc;border:2px solid #e2e8f0}.tip{background:#ecfdf5;border-color:#bbf7d0}.report{background:#fff7ed;border-color:#fed7aa}
.reportItem{background:#fff;border:3px solid #fed7aa;border-radius:22px;padding:16px;margin:14px 0}
.hidden{display:none!important}
.footer{text-align:center;color:#64748b;padding:22px}
.shape{width:90px;height:90px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:42px;border:5px solid #fff;box-shadow:0 8px 20px rgba(30,41,59,.12)}
.red{background:#ef4444}.blue{background:#3b82f6}.yellow{background:#facc15}.green{background:#22c55e}.purple{background:#a855f7}.orange{background:#fb923c}
@media(min-width:720px){.choices{grid-template-columns:1fr 1fr}.panel{padding:30px}}

.scoreLiveHide{display:none!important}

.versionBadge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,#4f46e5,#06b6d4);
  color:white;
  font-weight:1000;
  border-radius:999px;
  padding:10px 18px;
  box-shadow:0 10px 24px rgba(79,70,229,.22);
  margin:12px 0;
}
.versionNote{
  display:inline-block;
  background:#fff;
  color:#475569;
  border:2px solid #e2e8f0;
  border-radius:999px;
  padding:8px 14px;
  font-weight:800;
  margin-left:8px;
}
@media(max-width:640px){
  .versionNote{margin-left:0;margin-top:8px}
}

.liveResultHide{display:none!important}

button,.pill,.choice,.sstChoice,.tile,.modeBtn{

}

  padding:14px!important;
  line-height:1.55!important;

}

ruby.autoRuby{ruby-position:over;display:inline-ruby;line-height:1.25}

  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:rgba(22,163,74,.92);color:white;
  font-size:clamp(58px,16vw,128px);font-weight:1000;
  letter-spacing:.04em;text-shadow:0 6px 20px rgba(0,0,0,.25);
}
.hidden{display:none!important}
@media(max-width:640px){
  .top{position:static!important}
  .nav{gap:8px;flex-wrap:wrap}
  h1{font-size:clamp(27px,8vw,42px)!important}
  .lead{font-size:16px!important;line-height:1.6!important}
  .status{gap:7px!important;justify-content:center!important}
  .badge{font-size:14px!important;padding:7px 9px!important}
  .choices,.sstChoices{grid-template-columns:1fr!important}
  .grid{grid-template-columns:1fr!important}

const NIJI_QUESTION_BANK_VERSION='2026-09-02-q500-v1';
function nijiShuffleIds(values){const a=values.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function createQuestionBag(opts){const ids=[...new Set(opts.ids.map(String))],key='nijifla_qbag_v1:'+opts.gameId+':'+(opts.difficulty||'all');let state=null;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch(e){};const valid=state&&state.bankVersion===opts.bankVersion&&Array.isArray(state.order)&&state.order.length===ids.length&&state.order.every(x=>ids.includes(String(x)))&&Number.isInteger(state.cursor);if(!valid)state={bankVersion:opts.bankVersion,order:nijiShuffleIds(ids),cursor:0};function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function draw(n){const out=[],used=new Set();while(out.length<n){if(state.cursor>=state.order.length)state={bankVersion:opts.bankVersion,order:nijiShuffleIds(ids),cursor:0};const id=String(state.order[state.cursor++]);if(used.has(id))continue;used.add(id);out.push(id);save()}return out}return{draw}}
function nijiDrawBalanced(bank,gameId,count){const ratio=count===10?{easy:4,normal:4,challenge:2}:null,byId=new Map(bank.map(q=>[q.id,q]));if(!ratio){const ids=bank.map(q=>q.id),bag=createQuestionBag({gameId,difficulty:'all',bankVersion:NIJI_QUESTION_BANK_VERSION,ids});return bag.draw(count).map(id=>byId.get(id))}let out=[];for(const d of ['easy','normal','challenge']){const ids=bank.filter(q=>q.difficulty===d).map(q=>q.id),bag=createQuestionBag({gameId,difficulty:d,bankVersion:NIJI_QUESTION_BANK_VERSION,ids});out.push(...bag.draw(ratio[d]).map(id=>byId.get(id)))}return nijiShuffleIds(out)}

function R(text){
  const raw=String(text??"");
  let out="",i=0;
  while(i<raw.length){
    let hit=null;
    for(const pair of FURI_ENTRIES){
      const w=pair[0];
      if(!w) continue;
      if(raw.slice(i,i+w.length)===w){hit=pair;break}

するとよい？","answer":"「今は休みたい」と伝える","choices":["「今は休みたい」と伝える","無視する","怒る","うそをつく"],"category":"rules","tags":["既存"],"explanation":"休みたい気持ちも伝えて大丈夫です。","id":"sstq-legacy-071","difficulty":"easy"},{"prompt":"友だちが話しかけてきたけど作業中です。 どうするとよい？","answer":"「終わったら聞くね」と伝える","choices":["「終わったら聞くね」と伝える","無視する","怒る","作業を投げる"],"category":"friends","tags":["既存"],"explanation":"今できない時の伝え方です。","id":"sstq-legacy-072","difficulty":"easy"},{"prompt":"活動中にわからない言葉がありました。 どうするとよい？","answer":"「それはどういう意味？」と聞く","choices":["「それはどういう意味？」と聞く","わかったふりをする","怒る","やめる"],"category":"rules","tags":["既存"],"explanation":"言葉の意味は質問できます。","id":"sstq-legacy-073","difficulty":"easy"},{"prompt":"友だちが失敗を笑われていました。 どうするとよい？","answer":"笑わず大人に伝える","choices":["笑わず大人に伝える","一緒に笑う","動画を撮る","からかう"],"category":"friends","tags":["既存"],"explanation":"人の失敗を守る行動を考えます。","id":"sstq-legacy-074","difficulty":"easy"},{"prompt":"自分が失敗を笑われました。 どうするとよい？","answer":"嫌だったと大人に伝える","choices":["嫌だったと大人に伝える","たたく","言い返し続ける","物を投げる"],"category":"rules","tags":["既存"],"explanation":"嫌なことは大人に相談できます。","id":"sstq-legacy-075","difficulty":"easy"},{"prompt":"新しい活動が不安です。 どうするとよい？","answer":"何をするか大人に聞く","choices":["何をするか大人に聞く","逃げる","怒る","友だちを止める"],"category":"emotion","tags":["既存"],"explanation":"見通しを持つと安心しやすくなります。","id":"sstq-legacy-076","difficulty":"easy"},{"prompt":"予定が急に変わりました。 どうするとよい？","answer":"次に何をするか確認する","choices":["次に何をするか確認する","怒って動かない","走る","泣いて終わる"],"category":"rules","tags":["既存"],"explanation":"予定変更は確認して切り替えます。","id":"sstq-legacy-077","difficulty":"easy"},{"prompt":"友だちが自分の近くで泣いています。 どうするとよい？","answer":"静かにして大人に知らせる","choices":["静かにして大人に知らせる","理由をしつこく聞く","笑う","大きな声を出す"],"category":"friends","tags":["既存"],"explanation":"泣いている人には安心できる関わりをします。","id":"sstq-legacy-078","difficulty":"easy"},{"prompt":"自分の番を友だちにゆずりたいです。 どうするとよい？","answer":"「先にどうぞ」と伝える","choices":["「先にどうぞ」と伝える","黙っていなくなる","道具を投げる","相手を急がせる"],"category":"friends","tags":["既存"],"explanation":"譲る時も言葉で伝えます。","id":"sstq-legacy-079","difficulty":"easy"},{"prompt":"友だちがゆずってくれました。 どうすると let deck=[],i=0,ok=0,current="",records=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=nijiDrawBalanced(DATA,"sstQuiz",10);i=0;ok=0;records=[];document.getElementById("report").classList.add("hidden");show()}
function show(){document.getElementById("msg").textContent="";document.getElementById("tip").classList.add("hidden");if(i>=deck.length){finish();return}const q=deck[i];current=q.prompt;document.getElementById("num").textContent=i+1;document.getElementById("scene").innerHTML=R(q.prompt);const box=document.getElementById("choices");box.innerHTML="";shuffle(q.choices).forEach(t=>{const b=document.createElement("button");b.type="button";b.className="sstChoice";b.innerHTML=R(t);b.onclick=()=>answer(t===q.answer,t,b,q);box.appendChild(b)})}
function answer(good,selected,b,q){document.querySelectorAll(".sstChoice").forEach(x=>x.disabled=true);if(good){ok++;b.classList.add("correct");document.getElementById("msg").innerHTML='<span class="ok">いい選び方です</span>'}else{b.classList.add("wrong");document.getElementById("msg").innerHTML='<span class="ng">一緒に確認しよう</span>'}records.push({id:q.id,scene:q.prompt,selected,correct:q.answer,ok:good,point:q.explanation});document.getElementById("tip").classList.remove("hidden");document.getElementById("tip").innerHTML='<b>'+R("ポイント")+'</b><br>'+R(q.explanation);setTimeout(()=>{i++;show()},900)}
function finish(){document.getElementById("scene").innerHTML=R("おしまい");document.getElementById("choices").innerHTML="";let h='<h2>'+R("問題形式SST レポート")+'</h2><p>'+R("よく選べた数")+'：'+ok+' / '+records.length+'</p>';records.forEach((r,n)=>{h+='<div class="reportItem"><b>'+(n+1)+'. '+R(r.scene)+'</b><p>'+R("選んだ答え")+'：'+R(r.selected)+' '+(r.ok?'○':'△')+'</p><p>'+R("よい答え")+'：'+R(r.correct)+'</p><p>'+R("ポイント")+'：'+R(r.point)+'</p></div>'});let a4=null;if(window.NIJI_RESULT){a4=NIJI_RESULT.save({title:"SST｜問題形式SST",category:"SST",score:ok+"/"+records.length,detail:"10場面のSST。よい選択 "+ok+"、確認 "+(records.length-ok)+"。",success:ok>=8,type:"sst",source:"sst_quiz.html",extra:{items:records}});const hist=JSON.parse(localStorage.getItem("nijifla_sst_quiz_records")||"[]");hist.unshift({date:new Date().toLocaleString("ja-JP"),score:ok,total:records.length,all:records.map((x,n)=>({no:n+1,cat:"SST",illust:"💬",scene:x.scene,selected:x.selected,correct:x.correct,ok:x.ok,tip:x.point}))});localStorage.setItem("nijifla_sst_quiz_records",JSON.stringify(hist.slice(0,50)));h+='<div class="actions"><button type="button" id="a4Print">結果・評価をA4印刷</button></div>'}const rep=document.getElementById("report");rep.innerHTML=h;rep.classList.remove("hidden");if(a4){document.getElementById("a4Print").onclick=()=>location.href=NIJI_RESULT.reportUrl(a4)}showRetryButton()}
function readQ(){speakJP(current||document.getElementById("scene").textContent)}
document.addEventListener("DOMContentLoaded",()=>{document.getElementById("scene").innerHTML=R("スタートしてね")})

</script>




<script>
(function(){
  function getStartFunction(){
    if (typeof window.start === "function") return window.start;
    if (typeof window.startGame === "function") return window.startGame;
    if (typeof window.newGame === "function") return window.newGame;
    if (typeof window.begin === "function") return window.begin;
    return null;
  }

  window.hideStartButton = function(){
    var b = document.getElementById("startBtn");
    if (b) b.classList.add("hiddenStart");
  };

  window.showStartButton = function(){
    var b = document.getElementById("startBtn");
    if (b) b.classList.remove("hiddenStart");
  };

  window.confirmRetryGame = function(){
    var old = document.getElementById("retryConfirmOverlay");
    if (old) old.remove();

    var overlay = document.createElement("div");
    overlay.className = "confirmOverlay";
    overlay.id = "retryConfirmOverlay";
    overlay.innerHTML =
      '<div class="confirmCard">' +
        '<h2>もう1回の前に</h2>' +
        '<p>周りにやりたい友達がいないか確認してね。</p>' +
        '<div class="confirmActions">' +
          '<button type="button" id="retryOkBtn">OK</button>' +
          '<button type="button" class="light" id="retryCancelBtn">やめる</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    document.getElementById("retryCancelBtn").onclick = function(){
      overlay.remove();
    };

    document.getElementById("retryOkBtn").onclick = function(){
      overlay.remove();
      var box = document.getElementById("retryBox");
      if (box) box.remove();

      var fn = getStartFunction();
      if (fn) {
        try {
          fn();
          setTimeout(window.hideStartButton, 0);
        } catch(e) {
          location.reload();
        }
      } else {
        location.reload();
      }
    };
  };

  window.showRetryButton = function(){
    if (document.getElementById("retryBox")) return;

    var target =
      document.getElementById("msg") ||
      document.getElementById("report") ||
      document.querySelector(".panel") ||
      document.body;

    var box = document.createElement("div");
    box.className = "retryBox";
    box.id = "retryBox";
    box.innerHTML = '<button type="button" class="retryBtn" onclick="confirmRetryGame()">もう1回</button>';

    if (target && target.parentNode) {
      target.parentNode.insertBefore(box, target.nextSibling);
    } else {
      document.body.appendChild(box);
    }
  };

  document.addEventListener("DOMContentLoaded", function(){
    var b = document.getElementById("startBtn");
    if (b) {
      b.textContent = "スタート";
      b.addEventListener("click", function(){
        setTimeout(window.hideStartButton, 0);
      });
    }
  });
})();
</script>
