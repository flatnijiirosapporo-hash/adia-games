<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>児童別の経過｜にじフラ</title><link rel="icon" href="nijifla_icon.png"><link rel="stylesheet" href="assets/ui_v24.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fa;color:#183047;font-family:system-ui,'Yu Gothic','Hiragino Sans',sans-serif;line-height:1.55}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #d9e5ea}.nav{width:min(1180px,94vw);margin:auto;display:flex;gap:9px;align-items:center;padding:10px 0;flex-wrap:wrap}.nav a{background:#edf3f5;color:#294452;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:900}.wrap{width:min(1180px,94vw);margin:24px auto 54px}h1{font-size:clamp(30px,5vw,46px);margin:0}.lead{color:#607580}.choose{background:#fff;border:1px solid #d9e5ea;border-radius:22px;padding:16px;display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;align-items:end;margin:18px 0}.choose label span{display:block;font-size:12px;font-weight:900;color:#5d7480;margin-bottom:4px}.choose input,.choose select{width:100%;border:2px solid #c9d8df;border-radius:12px;padding:11px;font:inherit;background:#fff}.choose button{border:0;border-radius:12px;padding:12px 16px;background:#0f766e;color:#fff;font-weight:900;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat,.panel{background:#fff;border:1px solid #d9e5ea;border-radius:20px;padding:15px}.stat b{display:block;font-size:28px;color:#0f766e}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.panel h2{font-size:19px;margin:0 0 10px}.note{background:#fff8df;border:1px solid #f0d982;border-radius:14px;padding:10px 12px;font-size:12px;color:#654e16;margin:12px 0}.trendTable{width:100%;border-collapse:collapse;font-size:13px}.trendTable th,.trendTable td{border-bottom:1px solid #e2eaee;padding:8px 6px;text-align:left}.trendTable th{font-size:11px;color:#627884}.barRow{display:grid;grid-template-columns:130px 1fr 48px;gap:8px;align-items:center;margin:8px 0}.bar{height:13px;background:#e8eff2;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:#0f766e;border-radius:999px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{background:#edf7f5;color:#0f665f;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}.recent{display:grid;gap:8px}.rec{border:1px solid #e0e8ec;border-radius:14px;padding:11px;display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center}.rec a{background:#0f766e;color:#fff;border-radius:10px;padding:8px 10px;text-decoration:none;font-weight:900}.muted{color:#69808b}.empty{padding:28px;text-align:center;color:#687e89;border:1px dashed #b9cbd4;border-radius:18px}.metric{font-size:12px;color:#5f7681}.metric strong{font-size:24px;color:#0f766e;margin-right:4px}.delta{font-weight:900}.delta.up{color:#0f766e}.delta.down{color:#b45309}@media(max-width:900px){.choose{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.choose,.stats{grid-template-columns:1fr}.rec{grid-template-columns:1fr}.barRow{grid-template-columns:105px 1fr 40px}}
</style></head><body><div class="top"><div class="nav"><a href="index.html">← TOP</a><a href="records.html">記録一覧</a><a href="sst.html">SST</a></div></div><main class="wrap"><h1>📈 児童別の経過</h1><p class="lead">保存された職員観察を児童別にまとめます。診断・能力判定ではなく、支援記録を振り返るための画面です。</p>
<section class="choose"><label><span>児童名</span><input id="child" list="children" placeholder="過去の記録から選択"><datalist id="children"></datalist></label><label><span>開始日</span><input id="from" type="date"></label><label><span>終了日</span><input id="to" type="date"></label><button id="show">表示</button></section>
<div class="note">評価記号は表示のために ◎=3、○=2、△=1 と置き換えて集計します。「点数が高い＝能力が高い」という意味ではありません。同じ児童の記録で必要だった支援量の変化を見るための補助表示です。</div>
<div id="content"><div class="empty">児童名を選ぶと、実施回数・評価記入率・活動内訳・最近の観察評価を表示します。</div></div></main>
<script src="assets/result_store.js"></script><script src="assets/accessibility.js"></script><script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const q=new URLSearchParams(location.search);$('child').value=q.get('child')||'';
const rows=()=>NIJI_RESULT.list().map(r=>({r,e:NIJI_RESULT.getEvaluation(r.id)||{}}));const assessmentKeys=['overall','engage','understand','attention','switch','regulation','sst_scene','sst_perspective','sst_action','note','next','childVoice'];const meaningful=e=>!!assessmentKeys.some(k=>String(e?.[k]??'').trim());const childOf=(r,e)=>String(e.child||r.extra?.sessionContext?.child||'').trim();const dOnly=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dText=iso=>{const d=new Date(iso);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
function value(v){return v==='◎'?3:v==='○'?2:v==='△'?1:null}function avg(arr){const x=arr.filter(v=>v!=null);return x.length?x.reduce((a,b)=>a+b,0)/x.length:null}const axes=[['参加','engage'],['理解','understand'],['集中','attention'],['切替','switch'],['自己調整','regulation'],['場面理解','sst_scene'],['相手視点','sst_perspective'],['言葉・行動','sst_action']];
function names(){const ns=[...new Set(rows().map(x=>childOf(x.r,x.e)).filter(Boolean))].sort();$('children').innerHTML=ns.map(v=>`<option value="${E(v)}"></option>`).join('')}names();
function show(){const name=$('child').value.trim(),fr=$('from').value,to=$('to').value;if(!name){$('content').innerHTML='<div class="empty">児童名を選んでください。</div>';return}const list=rows().filter(({r,e})=>childOf(r,e)===name&&(!fr||dOnly(r.createdAt)>=fr)&&(!to||dOnly(r.createdAt)<=to));try{history.replaceState(null,'','child_summary.html?child='+encodeURIComponent(name)+(fr?'&from='+fr:'')+(to?'&to='+to:''))}catch{};if(!list.length){$('content').innerHTML='<div class="empty">指定条件の記録がありません。</div>';return}const evaled=list.filter(x=>meaningful(x.e)),game=list.filter(x=>x.r.type!=='sst'&&x.r.category!=='SST'),sst=list.filter(x=>x.r.type==='sst'||x.r.category==='SST'),latest=list[0];const cat={};list.forEach(x=>cat[x.r.category||'その他']=(cat[x.r.category||'その他']||0)+1);const titleCount={};list.forEach(x=>titleCount[x.r.title]=(titleCount[x.r.title]||0)+1);const repeats=Object.entries(titleCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const axisAv=axes.map(([label,key])=>({label,key,v:avg(evaled.map(x=>value(x.e[key])))})).filter(x=>x.v!=null);const recentEval=evaled.slice(0,10);const recent5=avg(recentEval.slice(0,5).flatMap(x=>axes.map(([,k])=>value(x.e[k]))));const prev5=avg(recentEval.slice(5,10).flatMap(x=>axes.map(([,k])=>value(x.e[k]))));let delta='比較データ不足';if(recent5!=null&&prev5!=null){const dif=recent5-prev5;delta=`直近5件 ${recent5.toFixed(2)} / 3　その前5件 ${prev5.toFixed(2)} / 3　<span class="delta ${dif>=0?'up':'down'}">差 ${dif>=0?'+':''}${dif.toFixed(2)}</span>`}else if(recent5!=null)delta=`直近 ${Math.min(5,recentEval.length)}件 ${recent5.toFixed(2)} / 3`;
 $('content').innerHTML=`<div class="stats"><div class="stat"><span>記録</span><b>${list.length}</b></div><div class="stat"><span>評価記入率</span><b>${Math.round(evaled.length/list.length*100)}%</b></div><div class="stat"><span>ゲーム</span><b>${game.length}</b></div><div class="stat"><span>SST</span><b>${sst.length}</b></div><div class="stat"><span>最終実施</span><b style="font-size:18px">${E(dText(latest.r.createdAt))}</b></div></div><div class="grid2"><section class="panel"><h2>観察評価のまとめ</h2><div class="metric">${delta}</div>${axisAv.length?axisAv.map(x=>`<div class="barRow"><span>${E(x.label)}</span><div class="bar"><i style="width:${Math.round(x.v/3*100)}%"></i></div><b>${x.v.toFixed(2)}</b></div>`).join(''):'<div class="muted">評価記号の入力がありません。</div>'}</section><section class="panel"><h2>活動の内訳</h2><div class="tags">${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag">${E(k)} ${v}回</span>`).join('')}</div><h2 style="margin-top:18px">繰り返し実施した活動</h2><div class="tags">${repeats.map(([k,v])=>`<span class="tag">${E(k)} ${v}回</span>`).join('')}</div></section></div><section class="panel" style="margin-top:14px"><h2>最近の記録</h2><div class="recent">${list.slice(0,12).map(({r,e})=>`<div class="rec"><div>${E(dText(r.createdAt))}<br><small class="muted">${r.type==='sst'?'SST':'ゲーム'}</small></div><div><b>${E(r.title)}</b><br><span class="muted">${E(e.overall||'総合評価未入力')}　${E(r.score||'')}</span></div><a href="${E(NIJI_RESULT.reportUrl(r))}">A4・編集</a></div>`).join('')}</div></section><div class="note">同じ活動でも、その日の体調・環境・課題難易度・支援者・提示方法で必要な支援量は変わります。数値だけで結論を出さず、A4の観察メモ・次回のねらいと合わせて確認してください。</div>`}
$('show').onclick=show;$('child').addEventListener('change',show);if(q.get('from'))$('from').value=q.get('from');if(q.get('to'))$('to').value=q.get('to');if($('child').value)show();
</script><script src="assets/layout_v25.js"></script></body></html>
