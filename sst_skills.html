['友だちに順番を抜かされて嫌でした。',['「先に並んでたよ。後ろに並んでほしい」','「お前最低！」','押し返す'],0,'事実＋気持ち・希望を伝えます。'],['話している途中で何度もさえぎられました。',['「最後まで話を聞いてほしい」','大声で黙れと言う','もう誰とも話さない'],0,'してほしい行動を具体的に伝えます。'],['大切な作品を勝手に触られて心配です。',['「大切だから、触る前に聞いてね」','作品を隠して相手を責める','相手の物も勝手に触る'],0,'自分の気持ちとルールを言葉にします。'],['負けて悔しいです。',['「悔しい。少し休んだらまたやる」','ゲームを壊す','勝った子を責める'],0,'強い気持ちも言葉にして、次の行動につなげます。'],['みんなの前で話すのが不安です。',['「緊張しています。ゆっくり話してもいいですか？」','無言で逃げる','他の子を笑う'],0,'不安を伝えることで必要な配慮を相談できます。'],['友だちが約束を忘れて悲しかったです。',['「忘れられて悲しかった。次は確認してほしい」','絶交と言う','仕返しする'],0,'相手を決めつけず、自分の感じ方を伝えます。'],['褒められてうれしかったです。',['「ありがとう。うれしい」','何も言わない','相手をからかう'],0,'うれしい気持ちも言葉にすると関係が育ちます。'],['予定が急に変わって困りました。',['「急に変わって困ってる。次を教えて」','床に寝転ぶ','みんなを止める'],0,'困り感＋必要な情報を伝えます。'],['大きな音が苦手です。',['「音が大きいとつらいので少し離れたいです」','全員に怒鳴る','我慢し続ける'],0,'感覚の困りごとも具体的に伝えられます。'],['自分だけ誘われず寂しいです。',['「一緒にやってもいい？」','遊びを邪魔する','全員を嫌いになる'],0,'気持ちを行動につなげる言葉を考えます。']]},

['友だちが昨日の出来事を話しています。',['相手を見て、話が終わってから質問する','途中で自分の話に変える','スマホだけを見る'],0,'聞く姿勢＋順番が会話を続けやすくします。'],['先生の説明が長くて途中が分からなくなりました。',['「ここからもう一度お願いします」','分かったふりをする','隣の子を責める'],0,'聞き返すことは悪いことではありません。'],['相手の言った意味が二つに取れます。',['「○○という意味で合ってる？」','勝手に決めつける','怒る'],0,'確認するとすれ違いを減らせます。'],['友だちが好きなゲームの話をしています。',['「どのキャラクターが好き？」と聞く','興味ないと言って終わる','話題を奪う'],0,'相手に関係する質問で会話が続きます。'],['二人が同時に話しかけてきました。',['「一人ずつ聞くね」と伝える','どちらも無視する','怒鳴る'],0,'聞く順番を整理できます。'],['自分も話したいことがあります。',['相手が区切ったところで「次、話していい？」','途中で大声を出す','ずっと我慢する'],0,'会話にも交代のタイミングがあります。'],['相手が悲しそうに話しています。',['「それはつらかったね」と受け止める','すぐ正論を言う','笑う'],0,'まず気持ちを受け止める聞き方があります。'],['聞いた予定を忘れそうです。',['メモして「これで合ってますか？」と確認する','覚えたふりをする','適当に返事する'],0,'メモや復唱も聞くための工夫です。'],['相手の声が小さくて聞こえません。',['「もう少し大きい声でお願いします」','適当に「うん」と言う','からかう'],0,'聞こえないことを丁寧に伝えます。'],['自分と意見が違います。',['最後まで聞いてから「私はこう思う」と話す','途中で否定する','相手を嫌いと決める'],0,'違う意見でも聞くことと賛成することは別です。']]},

perspective:{title:'相手の立場を考える',icon:'🧠',lead:'自分とは違う気持ちや考えがあることを練習します。',q:[
['自分はサッカーが大好きですが、友だちは今日は見学したいと言っています。',['「今日は見学したいんだね」と受け止める','好きなら絶対やるべきと言う','無理やり参加させる'],0,'好きなことや体調は人によって違います。'],['友だちが返事をしません。',['聞こえなかった・考え中など別の可能性も考える','嫌われたと決めつける','怒鳴る'],0,'一つの行動にも複数の理由があります。'],['自分には簡単な課題を友だちが難しそうにしています。',['必要なら「手伝おうか？」と聞く','ばかにする','勝手に全部やる'],0,'得意・苦手や必要な支援は人それぞれです。'],['友だちが急に一人になりました。',['疲れた・静かにしたい可能性も考える','絶対怒っていると決める','追いかけ続ける'],0,'相手の様子から仮説を持ちつつ、決めつけません。'],['先生が別の子を先に手伝っています。',['その子にも今必要な理由があると考えて待つ','自分だけ嫌われていると思う','邪魔をする'],0,'他者にも事情や優先があることを考えます。'],['友だちが自分の冗談で笑いませんでした。',['面白くない・嫌だった可能性を考える','笑わない方がおかしいと言う','もっと続ける'],0,'同じ言葉でも感じ方は人によって違います。'],['予定変更で自分は平気ですが、友だちは不安そうです。',['「急に変わると不安なんだね」と考える','大げさと言う','無視する'],0,'苦手な変化の大きさも人によって違います。'],['友だちがゲームで負けて黙っています。',['悔しい・落ち着きたい可能性を考えて少し待つ','すぐからかう','勝ち自慢を続ける'],0,'表情や状況から複数の気持ちを考えます。'],['自分は大きな音が平気です。',['苦手な人もいるので音量を確認する','平気だから最大音量にする','苦手な人を弱いと言う'],0,'感覚の感じ方は人によって違います。'],['友だちが「今は話したくない」と言いました。',['「分かった。話せるとき教えて」と距離を取る','理由を何度も聞く','みんなの前で追及する'],0,'相手の境界やタイミングを尊重します。']]}}
const mode=new URLSearchParams(location.search).get('mode')||'help', M=DB[mode]||DB.help;let deck=[],i=0,score=0,answered=false,details=[],started=0;
pageTitle.textContent=M.icon+' '+M.title;pageLead.textContent=M.lead;modeBadge.textContent=M.title;
function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){const j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}
function startGame(){deck=sh(M.q).slice(0,10);i=score=0;details=[];started=performance.now();actions.innerHTML='';show()}
function show(){answered=false;if(i>=deck.length)return finish();num.textContent=i+1;scoreEl=document.getElementById('score');scoreEl.textContent=score;const q=deck[i], opts=sh(q[1].map((t,idx)=>({t,ok:idx===q[2]})));stage.innerHTML=`<div class="scene">${q[0]}</div><div class="choices">${opts.map((x,n)=>`<button class="choice" data-n="${n}">${x.t}</button>`).join('')}</div><div class="feedback" id="fb">自分ならどうするか選んでみよう。</div>`;[...document.querySelectorAll('.choice')].forEach((b,n)=>b.onclick=()=>answer(opts[n],b,q))}
function answer(opt,b,q){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(opt.ok){score++;b.classList.add('good')}else b.classList.add('bad');document.getElementById('score').textContent=score;document.getElementById('fb').innerHTML=`<b>${opt.ok?'○ よい選び方です':'△ 一緒に確認しよう'}</b><br>${q[3]}`;details.push({scene:q[0],selected:opt.t,ok:opt.ok,tip:q[3]});setTimeout(()=>{i++;show()},1500)}
function finish(){const sec=Math.round((performance.now()-started)/1000), good=score>=8;const r=NIJI_RESULT.save({title:'SST｜'+M.title,category:'SST',score:`${score}/10`,detail:`${M.title}：10場面中 ${score}場面で適切な選択。`,success:good,durationSec:sec,type:'sst',source:'sst_skills.html?mode='+mode,extra:{items:details}});stage.innerHTML=`<div class="result"><h2>おしまい</h2><div style="font-size:34px;font-weight:1000">${score}/10</div><p>正解だけでなく、なぜその言い方・行動がよいかを一緒に確認してください。</p></div>`;actions.innerHTML=`<button class="primary" id="print">結果・評価を印刷</button><button class="secondary" id="retry">もう1回</button><a class="btn secondary" href="sst.html">SST一覧</a>`;print.onclick=()=>location.href=NIJI_RESULT.reportUrl(r);retry.onclick=()=>{if(confirm('周りにやりたい友達がいないか確認してね'))startGame()}}
document.getElementById('start').onclick=startGame;
</script><script src="assets/accessibility.js"></script><script src="assets/layout_v25.js"></script></body></html>
