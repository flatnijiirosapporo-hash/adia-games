<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>気持ちメーター</title><link rel="stylesheet" href="assets/sst_v21.css"><link rel="stylesheet" href="assets/ui_v24.css"></head><body><div class="top"><div class="nav"><a href="sst.html">← SST</a><span class="pill">自己理解・情動調整</span></div></div><main class="wrap"><section class="hero"><h1>🌡️ 気持ちメーター</h1><p class="lead">今の気持ちに名前をつけ、強さと「どうしたいか」を選びます。</p></section><section class="panel"><div id="stage"><h2>1. 今の気持ちは？</h2><div class="emotionGrid" id="emos"></div><h2>2. 強さは？</h2><div class="strength" id="strength"></div><h2>3. 今どうしたい？</h2><div class="choices" id="coping"></div><div class="field" style="margin-top:14px"><label>ひとこと（任意）</label><textarea id="note" placeholder="何があった？ どうしてそう思った？"></textarea></div></div><div class="actions"><button class="primary" id="save">記録して結果・評価へ</button></div></section></main><script src="assets/result_store.js"></script><script>
const E=['😄 うれしい','😌 あんしん','😢 かなしい','😡 おこっている','😨 こわい','😣 くやしい','😕 こまっている','😳 はずかしい'];const C=['少し一人で休みたい','先生に話を聞いてほしい','深呼吸したい','体を動かしたい','友だちに伝えたい','今は特に何もしなくていい'];let emo='',str='',cope='';emos.innerHTML=E.map(x=>`<button data-v="${x}">${x}</button>`).join('');strength.innerHTML=[1,2,3,4,5].map(x=>`<button data-v="${x}">${x}</button>`).join('');coping.innerHTML=C.map(x=>`<button class="choice" data-v="${x}">${x}</button>`).join('');function pick(group,set){document.querySelectorAll(group).forEach(b=>b.onclick=()=>{document.querySelectorAll(group).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');set(b.dataset.v)})}pick('#emos button',v=>emo=v);pick('#strength button',v=>str=v);pick('#coping button',v=>cope=v);save.onclick=()=>{if(!emo||!str||!cope)return alert('気持ち・強さ・どうしたいかを選んでください');const r=NIJI_RESULT.save({title:'SST｜気持ちメーター',category:'SST',score:`気持ちの強さ ${str}/5`,detail:`${emo}｜強さ ${str}/5｜${cope}${note.value?'｜'+note.value:''}`,success:null,type:'sst',source:'sst_emotion.html',extra:{emotion:emo,strength:str,coping:cope,note:note.value}});location.href=NIJI_RESULT.reportUrl(r)}
</script><script src="assets/accessibility.js"></script><script src="assets/layout_v25.js"></script></body></html>
