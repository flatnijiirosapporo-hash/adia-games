<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SST セッション｜にじフラ</title><link rel="icon" href="nijifla_icon.png"><link rel="stylesheet" href="assets/sst_v21.css"><style>
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}.step{background:#e8eef3;border-radius:999px;padding:8px;text-align:center;font-size:13px;font-weight:900;color:#617783}.step.on{background:#0f766e;color:#fff}.skillGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.skillBtn{background:#fff!important;color:#234!important;border:3px solid #dbeafe!important;box-shadow:none!important;text-align:left!important;border-radius:20px!important}.skillBtn.selected{border-color:#0f766e!important;background:#effbf8!important}.scenario{font-size:clamp(22px,4vw,34px);font-weight:1000;line-height:1.55;text-align:center;background:#fff;border:2px solid #dbeafe;border-radius:24px;padding:22px}.promptBox{background:#f7fafc;border:2px solid #dce7ec;border-radius:18px;padding:14px;margin:14px 0}.promptBox b{color:#0f766e}.ratingGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rate{border-radius:18px!important;min-height:72px!important;padding:10px!important}.r1{background:#0f766e!important}.r2{background:#3b82f6!important}.r3{background:#f59e0b!important}.r4{background:#64748b!important}.field2{margin:12px 0}.field2 label{font-weight:900;display:block;margin-bottom:5px}.field2 input,.field2 textarea,.field2 select{width:100%;border:2px solid #cbdbe3;border-radius:14px;padding:11px;font:inherit;background:#fff}.field2 textarea{min-height:86px}.model{display:none;background:#fff8df;border:2px solid #f2d57a;border-radius:16px;padding:12px;margin-top:10px;font-weight:800}.model.show{display:block}.trialDots{display:flex;gap:8px;justify-content:center;margin:8px 0}.dot{width:18px;height:18px;border-radius:50%;background:#dbe5ea}.dot.done{background:#0f766e}.summaryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.sum{background:#fff;border:1px solid #d9e5ea;border-radius:16px;padding:12px;text-align:center}.sum b{font-size:26px;display:block}.readBtn{background:#fff!important;color:#0f766e!important;border:2px solid #9ed6cd!important;box-shadow:none!important}
@media(max-width:700px){.skillGrid,.ratingGrid,.summaryGrid{grid-template-columns:1fr 1fr}.stepbar{grid-template-columns:1fr 1fr}}
</style><link rel="stylesheet" href="assets/ui_v24.css"></head><body>
<div class="top"><div class="nav"><a href="sst.html">← SST</a><span class="pill">構造化SST</span><a class="pill" href="records.html">記録</a></div></div>
<main class="wrap"><section class="hero"><h1>🎯 SST セッション</h1><p class="lead">目標を1つ決め、3回練習し、必要だった支援量と「実生活で使う場面」まで記録します。</p></section>
<div class="stepbar"><div class="step on" id="st1">1 ねらい</div><div class="step" id="st2">2 見本</div><div class="step" id="st3">3 練習</div><div class="step" id="st4">4 つなげる</div></div>
<section class="panel" id="setup"><h2>今日練習すること</h2><div class="skillGrid" id="skills"></div><div class="field2"><label>今日の個別目標（任意）</label><input id="goal" placeholder="例：嫌な時に『やめて』と落ち着いて伝える"></div><div class="field2"><label>難しさ</label><select id="level"><option value="basic">基本：分かりやすい場面</option><option value="real">実践：迷いやすい場面</option></select></div><div class="actions"><button class="primary" id="begin">セッション開始</button></div></section>
<section class="panel" id="practice" style="display:none"><div class="trialDots" id="dots"></div><div class="scenario" id="scene"></div><div class="actions"><button class="readBtn" id="read">🔊 場面を読み上げ</button><button class="light" id="showModel">見本を見る</button></div><div class="promptBox"><b>本人への問い：</b><span id="question"></span><div class="model" id="model"></div></div><div class="field2"><label>本人が実際に言ったこと・したこと（任意）</label><textarea id="childResponse" placeholder="職員が短く記録"></textarea></div><p style="font-weight:900;text-align:center">どのくらいの支援でできた？</p><div class="ratingGrid"><button class="rate r1" data-rate="independent">◎<br>自分で</button><button class="rate r2" data-rate="verbal">○<br>声かけ</button><button class="rate r3" data-rate="model">△<br>見本・視覚</button><button class="rate r4" data-rate="pause">—<br>中断・調整</button></div></section>
<section class="panel" id="generalize" style="display:none"><h2>実生活につなげる</h2><div class="summaryGrid" id="summary"></div><div class="field2"><label>次にこのスキルを使う場面</label><textarea id="nextScene" placeholder="例：公園で順番を待つ時／友だちに嫌なことをされた時"></textarea></div><div class="field2"><label>本人が使う合図・ことば</label><input id="cue" placeholder="例：『先生、手伝って』／深呼吸してから言う"></div><div class="field2"><label>職員の支援方法</label><textarea id="support" placeholder="例：すぐ答えを言わず5秒待つ。難しい時は2択で示す。"></textarea></div><div class="actions"><button class="primary" id="finish">結果・評価へ</button><button class="secondary" id="again">もう1回練習</button></div></section></main>
<script src="assets/result_store.js"></script><script src="assets/accessibility.js"></script><script>
const BANK={
help:{name:'🆘 助けを求める',q:'困っていることと、してほしいことをどう伝える？',basic:[['宿題のやり方が分からなくなった。','「ここが分かりません。教えてください」'],['水筒のふたが開かない。','「開けるのを手伝ってください」'],['友だちの輪に入りたいけれど言い出せない。','「一緒に入ってもいい？」'],['物をなくして見つからない。','「一緒に探してもらえますか？」']],real:[['遊びのルールが途中から分からなくなった。','「ルールをもう一度教えて」'],['周りが忙しそうで先生に声をかけにくい。','「先生、話せる時に教えてください」'],['友だちとのトラブルで自分だけでは解決できない。','「先生、困っていることがあります」'],['活動中に気持ちがいっぱいになってきた。','「少し休みたいです」']]},
refuse:{name:'✋ 上手に断る',q:'相手を傷つけすぎず、自分を守る言い方は？',basic:[['今は貸したくない物を「貸して」と言われた。','「今は使っているから、あとでね」'],['危ない遊びに誘われた。','「それはやらない」'],['苦手な食べ物を無理にすすめられた。','「ありがとう。でも今はいらない」'],['一人で休みたい時に遊びへ誘われた。','「今は休みたい。あとで遊ぼう」']],real:[['何度断っても同じことを頼まれる。','「何回言われても、今日はしないよ」'],['友だち全員がやると言っている危ない遊び。','「みんながやっても、ぼくはやらない」'],['冗談で嫌なあだ名を言われた。','「その呼び方は嫌だからやめて」'],['自分の物を勝手に使われそうになった。','「使う前に聞いてほしい」']]},
feel:{name:'💗 気持ちを伝える',q:'事実＋自分の気持ち＋してほしいことをどう言う？',basic:[['順番を抜かされて嫌だった。','「先に並んでいたから、順番を守ってほしい」'],['大きな声でびっくりした。','「大きい声だとびっくりするから、少し小さくして」'],['作品をほめられてうれしかった。','「うれしい。ありがとう」'],['負けて悔しい。','「悔しいから、少し落ち着いてから話す」']],real:[['わざとかどうか分からないけれどボールが顔に当たった。','「痛かった。まず大丈夫か聞いてほしい」'],['約束していた遊びが急に変わった。','「楽しみにしていたから残念。次は先に教えてほしい」'],['自分の話を途中で何度も遮られた。','「最後まで聞いてもらえるとうれしい」'],['注意されて恥ずかしくなった。','「今は恥ずかしい。少ししてから話したい」']]},
listen:{name:'👂 聞く・会話',q:'相手の話を受け取り、会話を続けるには？',basic:[['友だちが昨日の出来事を話している。','相手を見る・最後まで聞く・「それで？」と聞く'],['聞こえなかった。','「もう一回言って」'],['意味が分からない言葉が出てきた。','「それってどういう意味？」'],['自分も話したいことがある。','相手が話し終わってから「ぼくも話していい？」']],real:[['興味がない話題が続いている。','短く聞いた後「次はぼくの話もしていい？」'],['相手の説明と自分の理解が違いそう。','「○○ってこと？」と確認する'],['複数人で話していて入るタイミングが難しい。','少し待って「ぼくもいい？」と入る'],['相手が話したくなさそう。','質問を続けず「また話したくなったら教えて」']]},
repair:{name:'🤝 仲直り・やり直し',q:'謝るだけでなく、関係を直すために何ができる？',basic:[['ぶつかって相手の物を落とした。','「ごめん。大丈夫？一緒に拾うよ」'],['約束を忘れてしまった。','「忘れてごめん。次はメモする」'],['強い言い方をしてしまった。','「言い方が強かった。言い直すね」'],['順番を間違えた。','「ごめん。次どうぞ」']],real:[['わざとではないが相手がとても怒っている。','「わざとじゃなくても嫌だったよね。ごめん」'],['自分にも言い分があるトラブル。','自分の気持ちを伝えつつ、相手が嫌だった点も確認する'],['謝ったのに相手がすぐ許してくれない。','無理に許させず、時間をおいて行動で示す'],['同じことで何度も注意されている。','謝る＋次に変える具体的な方法を決める']]},
perspective:{name:'🧠 相手の立場',q:'相手にはどんな気持ち・理由があるか、1つ以上考えられる？',basic:[['友だちが今日は一緒に遊ばないと言った。','疲れている／別の約束がある／一人でいたいかもしれない'],['先生がすぐ返事をしなかった。','別の子に対応している／聞こえなかったかもしれない'],['弟が大事な物を触った。','大事だと知らなかった／興味があったかもしれない'],['友だちがルールを間違えた。','知らなかった／勘違いしたかもしれない']],real:[['相手が謝ってくれない。','まだ気持ちが整理できない／何を謝るか分からないかもしれない'],['自分は冗談のつもりだったのに相手が怒った。','相手には傷つく言葉だったかもしれない'],['いつも仲の良い友だちが別の子と遊んでいる。','自分を嫌いになったとは限らない'],['相手が約束の時間に遅れた。','忘れた以外の事情もあるかもしれない']]},
wait:{name:'⏳ 順番・待つ',q:'待つ間にできる安全な行動は？',basic:[['すべり台に友だちが並んでいる。','列の最後に並ぶ'],['ゲームの自分の番がまだ来ない。','他の人の番を見る'],['先生が別の子と話している。','近くで待つ／急ぎなら「あとで話したい」と伝える'],['おやつを配っている途中。','席で待つ']],real:[['待つ時間が長くイライラしてきた。','深呼吸／残りを確認／一度離れて待てるか相談'],['自分の前の子が時間をかけている。','急かさず、必要なら職員に相談'],['順番が分からなくなった。','勝手に入らず「次は誰？」と確認'],['友だちに先を譲ってと言われた。','理由を聞き、難しければ「順番でやろう」と伝える']]},
trouble:{name:'🧩 トラブル対応',q:'安全を優先しながら、次に何をする？',basic:[['友だちに嫌なことを言われた。','「やめて」と伝え、続くなら職員に相談'],['物を取られた。','取り返して争わず、返してと伝える／職員へ相談'],['けがをした。','すぐ大人に伝える'],['知らない人に声をかけられた。','ついて行かず、知っている大人に伝える']],real:[['相手も怒っていて話が通じない。','距離を取り、落ち着いてから大人を入れて話す'],['SNSやゲームで嫌なメッセージが来た。','返し続けず、画面を残して保護者・大人へ相談'],['自分も手を出しそうなくらい腹が立つ。','その場から離れる／職員へ「今危ない」と伝える'],['友だち同士のケンカを見た。','自分で止めに入らず、近くの大人を呼ぶ']]}
};
let skill='',deck=[],idx=0,trials=[],started=0;
const $=id=>document.getElementById(id);
function setStep(n){[1,2,3,4].forEach(i=>$('st'+i).classList.toggle('on',i===n))}
$('skills').innerHTML=Object.entries(BANK).map(([k,v])=>`<button class="skillBtn" data-skill="${k}">${v.name}</button>`).join('');
document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{skill=b.dataset.skill;document.querySelectorAll('[data-skill]').forEach(x=>x.classList.toggle('selected',x===b))});
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
$('begin').onclick=()=>{if(!skill)return alert('今日練習することを選んでください');const s=BANK[skill],lv=$('level').value;deck=shuffle(s[lv]).slice(0,3);idx=0;trials=[];started=performance.now();$('setup').style.display='none';$('practice').style.display='block';setStep(2);showTrial()};
function showTrial(){setStep(idx===0?2:3);$('dots').innerHTML=[0,1,2].map(i=>`<span class="dot ${i<idx?'done':''}"></span>`).join('');const x=deck[idx];$('scene').textContent=x[0];$('question').textContent=BANK[skill].q;$('model').textContent='見本：'+x[1];$('model').classList.remove('show');$('childResponse').value=''}
$('showModel').onclick=()=>$('model').classList.toggle('show');
$('read').onclick=()=>{if(!('speechSynthesis'in window))return alert('このブラウザでは読み上げを利用できません。');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('scene').textContent);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)};
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{const x=deck[idx];trials.push({scene:x[0],model:x[1],response:$('childResponse').value.trim(),rating:b.dataset.rate});idx++;if(idx<3)showTrial();else showGeneralize()});
function counts(){return {independent:trials.filter(x=>x.rating==='independent').length,verbal:trials.filter(x=>x.rating==='verbal').length,model:trials.filter(x=>x.rating==='model').length,pause:trials.filter(x=>x.rating==='pause').length}}
function showGeneralize(){$('practice').style.display='none';$('generalize').style.display='block';setStep(4);const c=counts();$('summary').innerHTML=`<div class="sum"><b>${c.independent}</b>自分で</div><div class="sum"><b>${c.verbal}</b>声かけ</div><div class="sum"><b>${c.model}</b>見本・視覚</div><div class="sum"><b>${c.pause}</b>中断・調整</div>`}
$('finish').onclick=()=>{const c=counts(),g=$('goal').value.trim()||BANK[skill].name.replace(/^\S+\s*/,''),detail=`ねらい：${g}｜3試行：自立${c.independent}・声かけ${c.verbal}・見本/視覚${c.model}・中断/調整${c.pause}｜次に使う場面：${$('nextScene').value.trim()||'未入力'}｜合図・ことば：${$('cue').value.trim()||'未入力'}`;const r=NIJI_RESULT.save({title:'SSTセッション｜'+BANK[skill].name,category:'SST',score:`自立 ${c.independent}/3`,detail,success:null,durationSec:Math.round((performance.now()-started)/1000),type:'sst',source:'sst_session.html',extra:{skill,goal:g,level:$('level').value,trials,nextScene:$('nextScene').value.trim(),cue:$('cue').value.trim(),support:$('support').value.trim(),counts:c}});const pre={next:$('support').value.trim()||$('nextScene').value.trim(),note:trials.map((t,i)=>`${i+1}回目：${t.response||'本人発言未記録'}（${{independent:'自立',verbal:'声かけ',model:'見本・視覚',pause:'中断・調整'}[t.rating]}）`).join('\n')};NIJI_RESULT.saveEvaluation(r.id,pre);location.href=NIJI_RESULT.reportUrl(r)};
$('again').onclick=()=>{if(!confirm('周りにやりたい友達がいないか確認してね'))return;$('generalize').style.display='none';$('practice').style.display='block';deck=shuffle(BANK[skill][$('level').value]).slice(0,3);idx=0;trials=[];started=performance.now();showTrial()};
</script><script src="assets/layout_v25.js"></script></body></html>
