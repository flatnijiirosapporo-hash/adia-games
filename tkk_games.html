<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>にじフラ チャレンジ</title>
<link rel="icon" href="nijifla_icon.png">
<link rel="stylesheet" href="assets/tkk_pack.css">
<link rel="stylesheet" href="assets/ui_v24.css">
</head>
<body class="game-body niji-v24">
<header class="site-header"><div class="head-inner"><img class="brand-logo" src="nijifla_logo.png" alt="にじフラ"><div class="brand-copy"><b>にじフラ チャレンジ</b><small>ゲーム</small></div><div class="head-actions"><button class="nav-btn focus-toggle" id="focusBtn" type="button">集中モード</button><a class="nav-btn" href="records.html">記録</a><a class="nav-btn" href="index.html">← TOP</a></div></div></header>
<main class="game-shell">
  <section class="game-head-card" aria-labelledby="title">
    <div class="game-top"><span class="category" id="cat"></span><button class="favorite-game-btn" id="favGameBtn" type="button" aria-label="お気に入りに追加">★</button><div class="spacer"></div><a class="nav-btn" href="index.html#allGames">ゲームを変える</a></div>
    <h1 class="game-title" id="title">ゲーム</h1>
    <p class="game-desc" id="desc"></p>
    <div class="game-meta-row" id="metaTags"></div>
  </section>
  <section class="play-card" aria-label="ゲームエリア">
    <div class="toolbar" id="toolbar"><span class="status-pill" id="status" aria-live="polite">準備OK</span></div>
    <div class="stage" id="stage"><div class="game-ready"><div class="ready-icon" id="heroIcon">🎮</div><div class="ready-label">このゲームでやること</div><div class="ready-title">準備ができたらスタート</div></div></div>
    <div class="play-actions" id="actions"><button class="primary" id="startBtn">スタート</button></div>
  </section>
  <nav class="game-bottom-nav" aria-label="ゲーム下部メニュー"><a href="index.html#allGames">← ゲーム一覧</a><a href="sst.html">SST</a><a href="records.html">結果・記録</a></nav>
</main>
<div id="confetti" class="confetti hidden"></div>
<script src="assets/game_catalog.js"></script>
<script src="assets/game_profile_v24.js"></script>
<script src="assets/result_store.js"></script>
<script src="assets/tkk_games.js"></script>
<script src="assets/layout_v25.js"></script>
<script src="assets/accessibility.js"></script>
</body></html>
